[workspace]
resolver = "2"
members = [
    ".",
    "apps/dsp_recorder",
    "crates/core",
    "crates/runtime_cli",
]

[package]
name = "ai_core_framework"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
cpal = "0.18.2"
hound = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
anyhow = "1.0"
reqwest = { version = "0.13.5", features = ["json"] }
ndarray = "0.17"
ai_core = { path = "crates/core" }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "2.0.0-rc.6", features = ["download-binaries", "directml", "cuda", "ndarray"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
ort = { version = "2.0.0-rc.6", features = ["download-binaries", "cuda", "ndarray"] }

[[bin]]
name = "model_validator"
path = "src/main.rs"
