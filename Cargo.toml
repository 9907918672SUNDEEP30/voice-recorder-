[workspace]
resolver = "2"
members = [
    ".",
    "crates/core",
    "crates/runtime_cli",
]

[package]
name = "ai_core_framework"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
ort = { version = "2.0.0-rc.6", features = ["download-binaries","directml"] }
cpal = "0.18.2"
hound = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
anyhow = "1.0"
reqwest = { version = "0.13.5", features = ["json"] }

[[bin]]
name = "model_validator"
path = "src/main.rs"