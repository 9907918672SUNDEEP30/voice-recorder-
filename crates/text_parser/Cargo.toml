[package]
name = "text_parser"
version = "0.1.0"
edition = "2021"
authors = ["AI Core Framework Team"]
description = "Fast, Native Document Extraction and Sliding-Window Chunker for PDFs, CSVs, and Text"

[dependencies]
lopdf = "0.32"
csv = "1.3"
regex = "1.10"
unicode-segmentation = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
