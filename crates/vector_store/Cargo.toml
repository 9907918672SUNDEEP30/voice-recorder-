[package]
name = "vector_store"
version = "0.1.0"
edition = "2021"
authors = ["AI Core Framework Team"]
description = "AES-256-GCM Encrypted Document Vault and High-Performance Cosine Vector Index"

[dependencies]
text_parser = { path = "../text_parser" }
aes-gcm = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
