[package]
name = "core_engine"
version = "0.1.0"
edition = "2021"
authors = ["AI Core Framework Team"]
description = "DirectML GPU and Local ONNX AI Acceleration Engine for BGE Embeddings and Qwen LLM"

[dependencies]
ai_core = { path = "../core" }
ort = { version = "2.0.0-rc.6", features = ["ndarray"] }
ndarray = "0.15"
tokenizers = "0.15"
tokio = { version = "1.38", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
async-trait = "0.1"
