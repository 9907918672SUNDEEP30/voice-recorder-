[package]
name = "ai_core"
version = "0.1.0"
edition = "2021"
authors = ["Core Engine Team"]
description = "High-performance, zero-bloat, application-agnostic AI Agent Runtime Core Engine"
license = "MIT OR Apache-2.0"

[dependencies]
# Dependencies for neutral AI Core Frameork models
ort = { version = "2.0.0-rc.6", features = ["ndarray"] }
ndarray = "0.15"
tokio = { version = "1.38", features = ["full"] }
tokio-util = "0.7.11"
bytes = "1.6.0"
anyhow = "1.0"
async-trait = "0.1.80"

# Real SaaS Logic Libraries
tokenizers = "0.15"       # Real BPE Tokenization for LLM
rubato = "0.14"           # Real DSP Audio Resampling (16kHz <-> 8kHz)
regex = "1.10"            # Text parsing
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

