[package]
name = "rust_file_finder"
version = "1.0.0"
description = "Sovereign Fast File Finder — 100% Free & Open Source Sub-Millisecond File Search & Smart Alias"
authors = ["Sundeep & Shambhavi Contributors"]
license = "MIT OR Apache-2.0"
edition = "2021"

[lib]
name = "rust_file_finder"
path = "src/lib.rs"

[[bin]]
name = "rust_file_finder"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
rayon = "1.10"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
