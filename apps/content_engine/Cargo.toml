[package]
name = "content_engine"
version = "0.1.0"
edition = "2021"
authors = ["Sandeep Udasi", "AI Core Framework Content Engine Team"]
description = "Universal Autonomous Content & Media Engine with Trend Reconnaissance and Cloud Video Production"

[dependencies]
# 1. AI Core Framework Engine (Local LLM, Whisper STT, TTS, Vision)
ai_core = { path = "../../crates/core" }

# 2. Shared 24-Hour Cryptographic DRM & Licensing
drm_guard = { path = "../../crates/drm_guard" }

# 3. Video Studio Engine (Gaze Correction, 3D LUT, Auto-Framing)
video_studio = { path = "../video_studio" }

# 4. Async Runtime & Networking
tokio = { version = "1.38", features = ["full", "process"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["json"] }
dotenvy = "0.15"

# 5. Image & Media Containers
bytes = "1.6"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
hound = "3.5"
base64 = "0.22"
ndarray = "0.15.6"

# 6. Web & RSS Parsing
quick-xml = "0.36"
