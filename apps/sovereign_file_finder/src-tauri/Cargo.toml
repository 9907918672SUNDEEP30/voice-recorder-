[package]
name = "sovereign_file_finder"
version = "1.0.0"
description = "Sovereign Fast File Finder - Open Source Sub-Millisecond File Search & Smart Alias"
authors = ["Sundeep & Shambhavi Contributors"]
license = "MIT OR Apache-2.0"
edition = "2021"

[workspace]

[lib]
name = "sovereign_file_finder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
walkdir = "2.5"
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0"
rayon = "1.10"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
