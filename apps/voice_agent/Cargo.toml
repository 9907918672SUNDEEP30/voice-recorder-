[package]
name = "voice_agent"
version = "0.1.0"
edition = "2021"

[dependencies]
# ai_core is the framework root library
ai_core = { path = "../../crates/core" }

# High-performance async runtime
tokio = { version = "1.38", features = ["full"] }
tokio-util = "0.7.11"
tokio-stream = "0.1"

# Audio buffer management
bytes = "1.6.0"

# Local ONNX runtime
ort = { version = "2.0.0-rc.6", features = ["ndarray"] }
ndarray = "0.15"

# WebSockets / Web server (Telephony Gateway)
axum = { version = "0.7.5", features = ["ws", "macros"] }
futures = "0.3.30"

# JSON/Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
async-trait = "0.1.80"
regex = "1.10.4"
base64 = "0.22"
reqwest = { version = "0.13.5", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }

# Shared DRM Guard & 24h Licensing
drm_guard = { path = "../../crates/drm_guard" }
