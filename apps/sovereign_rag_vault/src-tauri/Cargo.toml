[package]
name = "sovereign_rag_vault"
version = "0.1.0"
description = "Shambhavi Sovereign RAG Vault Desktop Client & DirectML Hardware-Locked Core"
authors = ["Shambhavi AI Labs"]
edition = "2021"

[workspace]

[lib]
name = "sovereign_rag_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
walkdir = "2.5"
sha2 = "0.10"
hex = "0.4"
zeroize = { version = "1.8", features = ["derive"] }
anyhow = "1.0"
rayon = "1.10"
chrono = { version = "0.4", features = ["serde"] }

# SQLite & Cryptography
rusqlite = { version = "0.31", features = ["bundled"] }
aes-gcm = "0.10"
rand = "0.8"
ed25519-dalek = { version = "2.1", default-features = false }


# Anti-Reverse Engineering & Maximum Binary Hardening
[profile.release]
opt-level = "z"        # Optimize for smallest binary footprint & obfuscation
lto = true             # Link-Time Optimization strips internal symbol cross-refs
codegen-units = 1      # Maximum cross-module optimization & symbol merging
panic = "abort"        # Prevent stack trace leakage on panics
strip = true           # Strip all native debug symbols, line numbers, and function names
