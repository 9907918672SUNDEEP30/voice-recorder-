[package]
name = "nvr_core"
version = "0.1.0"
edition = "2021"
authors = ["AI Core Framework CCTV NVR Team"]
description = "Commercial Pure-Rust AI CCTV NVR Hardware Appliance Engine"

[dependencies]
# 1. Framework Core (telemetry, tensor utilities)
ai_core = { path = "../../crates/core" }

# 2. Async Runtime & Concurrency
tokio = { version = "1.38", features = ["full"] }
crossbeam-channel = "0.5.13"
parking_lot = "0.12"

# 3. Serialization, Config & HTTP Networking
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.13.5", features = ["json"] }

# 4. Direct Hardware HDMI Display Window
minifb = "0.27"

# 4. Image Processing & Fast Memory Buffers
bytes = "1.6"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }

# 5. ONNX Runtime (CPU SIMD acceleration)
ort = { version = "2.0.0-rc.6", features = ["ndarray"] }
ndarray = "0.15"
