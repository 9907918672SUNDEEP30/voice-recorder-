[package]
name = "financial_engine"
version = "0.1.0"
edition = "2021"
authors = ["AI Core Framework Financial Engine Team"]
description = "Pure Rust Financial Super Engine - Autonomous Equity Analytics, CDP Scraper, and Ratio Engine"

[dependencies]
# 1. AI Core Engine Inheritance (Local ONNX Models: BGE, Reranker, Qwen)
ai_core = { path = "../../crates/core" }

# 2. Async Runtime & Lock-Free Concurrency
tokio = { version = "1.38", features = ["full"] }
tokio-util = "0.7.11"
futures = "0.3"
dashmap = { version = "5.5", features = ["serde"] }

# 3. Serialization & Math
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# 4. Networking & Headless CDP Scraping
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chromiumoxide = { version = "0.5", default-features = false, features = ["tokio-runtime"] }

# 5. Native PDF Extraction & Text Processing
lopdf = "0.32"
regex = "1.10"
anyhow = "1.0"

[[bin]]
name = "financial_engine"
path = "src/main.rs"
