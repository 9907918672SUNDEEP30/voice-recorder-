name: Build Sovereign Fast File Finder (Rolling Latest Multi-OS)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/sovereign_file_finder/**'
      - 'apps/rust_file_finder/**'
      - '.github/workflows/build-file-finder.yml'
  workflow_dispatch:

jobs:
  build-file-finder:
    name: Build & Release Bundle (${{ matrix.os_name }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            os_name: 'Windows'
          - platform: 'macos-latest'
            os_name: 'macOS'
          - platform: 'ubuntu-22.04'
            os_name: 'Linux'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Setup Rust Toolchain (Stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os_name == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 4. Cache Rust & Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/sovereign_file_finder/src-tauri -> target"

      - name: 5. Install Linux GUI System Dependencies
        if: matrix.os_name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: 6. Install Frontend Dependencies
        working-directory: apps/sovereign_file_finder
        run: npm install

      - name: 7. Build All-In-One Native Desktop Bundle (Tauri v2)
        uses: tauri-apps/tauri-action@v0.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: "apps/sovereign_file_finder"
          tagName: file-finder-latest
          releaseName: 'Sovereign Fast File Finder (Rolling Latest Release)'
          releaseBody: |
            ## ⚡ Sovereign Fast File Finder Rolling Latest Release (100% Free & Open Source)
            - **Core Framework Integration:** Native AI Core Framework Architecture
            - **Auto-Update Enabled:** Existing installations update in-place automatically via `latest.json`.
            - **Rayon Parallel Core:** Sub-millisecond recursive filesystem traversal (<1ms on C:\ and D:\).
            - **Smart Virtual Alias:** In-memory client name, doc type, and year matching for cryptic scans.
            - **1-Click Atomic Renamer:** Safe, disk-level filename standardization.
            - **Cross-Platform:** Single installer bundle for Windows (.exe NSIS + .msi), macOS (.dmg Universal), and Linux (.AppImage + .deb).
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
