name: Build Sovereign CDM Vault (Rolling Latest Multi-OS)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/sovereign_cdm_vault/**'
      - 'apps/cdm_engine/**'
      - '.github/workflows/build-cdm-vault.yml'
  workflow_dispatch:

jobs:
  build-cdm-vault:
    name: Build & Release Bundle (${{ matrix.os_name }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            os_name: 'Windows'
          - platform: 'macos-latest'
            os_name: 'macOS'
          - platform: 'ubuntu-22.04'
            os_name: 'Linux'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Setup Rust Toolchain (Stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os_name == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 4. Cache Rust & Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/sovereign_cdm_vault/src-tauri -> target"

      - name: 5. Install Linux GUI System Dependencies
        if: matrix.os_name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: 6. Install Frontend Dependencies
        working-directory: apps/sovereign_cdm_vault
        run: npm install

      - name: 7. Build All-In-One Native Desktop Bundle (Tauri v2)
        uses: tauri-apps/tauri-action@v0.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: "apps/sovereign_cdm_vault"
          tagName: cdm-vault-latest
          releaseName: 'Sovereign CDM Vault (Rolling Latest Release)'
          releaseBody: |
            ## 🏛️ Sovereign CDM Vault Rolling Latest Release (25-Year Zero-RAG Matrix)
            - **Core Framework Integration:** Native AI Core Framework Architecture
            - **Auto-Update Enabled:** Existing installations update in-place automatically via `latest.json`.
            - **100% Zero-RAG, Zero Vectors, Zero Chunks:** Deterministic mathematical precision (<0.001ms queries).
            - **2-Stage Hybrid Automata:** Stage 1 Pure Rust Regex/Automata (80%) + Stage 2 Qwen2-VL INT4 Vision (20%).
            - **Cryptographic Audit Vault:** Embedded SQLite (`matrix.db`) + SHA-256 chained immutable audit trail (`audit_log.bin`).
            - **Cross-Platform:** Single installer bundle for Windows (.exe NSIS + .msi), macOS (.dmg Universal), and Linux (.AppImage + .deb).
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
